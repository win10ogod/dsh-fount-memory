name: Test memory recall safety
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - if: runner.os == 'Linux'
        run: npm pack
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: dsh-fount-memory-package
          path: '*.tgz'
